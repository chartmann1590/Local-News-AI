services:
  app:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE:-$(Get-Date -Format 'yyyy-MM-dd-HHmmss')}
    container_name: news-ai-app
    env_file:
      - .env
    ports:
      - "18080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Optional manual override. Leave unset to auto-detect location.
      - LOCATION_NAME=${LOCATION_NAME}
      - MIN_ARTICLES_PER_RUN=${MIN_ARTICLES_PER_RUN:-10}
      - TZ=${TZ:-America/New_York}
      - SCHEDULE_MORNING=${SCHEDULE_MORNING:-07:30}
      - SCHEDULE_NOON=${SCHEDULE_NOON:-12:00}
      - SCHEDULE_EVENING=${SCHEDULE_EVENING:-19:30}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - TTS_BASE_URL=${TTS_BASE_URL:-http://tts:5500}
      - FEED_EXTRA_URLS=${FEED_EXTRA_URLS:-https://www.timesunion.com/local/?service=rss,https://www.troyrecord.com/feed/,https://spectrumlocalnews.com/nys/capital-region.rss,https://wnyt.com/feed/,https://feeds.npr.org/1001/rss.xml,https://feeds.bbci.co.uk/news/rss.xml,https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml,https://www.theguardian.com/us/rss,https://www.cbsnews.com/latest/rss/main}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - ENABLE_FACT_CHECKING=${ENABLE_FACT_CHECKING:-true}
    volumes:
      - /mnt/h/News-AI/data:/data
    restart: unless-stopped

  tts:
    image: synesthesiam/opentts:latest
    container_name: news-ai-tts
    # Enable all available TTS engines (Coqui, Piper, Larynx, etc.)
    # OPENTTS_ENGINES is not set, allowing all engines
    volumes:
      - type: bind
        source: /mnt/h/News-AI/data/tts
        target: /root/.local/share/opentts
    expose:
      - "5500"
    restart: unless-stopped
    # Memory limits to prevent OOM kills
    mem_limit: 2g
    mem_reservation: 512m
    # Use --shm-size for shared memory
    shm_size: 256m

  nginx:
    image: nginx:alpine
    container_name: news-ai-nginx-ssl
    depends_on:
      - app
    ports:
      # Expose HTTPS on a free high port (not 443)
      - "18443:443"
    environment:
      # Optional: customize cert CN and SANs via env override if desired
      - SSL_CN=news-ai.local
      - SSL_SAN=DNS:news-ai.local,DNS:localhost
    command: >-
      sh -c "apk add --no-cache openssl >/dev/null 2>&1; mkdir -p /etc/nginx/certs /etc/nginx/conf.d;
      openssl req -x509 -nodes -newkey rsa:2048 -batch -keyout /etc/nginx/certs/server.key -out /etc/nginx/certs/server.crt -days 365 -subj '/CN=news-ai.local';
      echo 'server {' > /etc/nginx/conf.d/default.conf;
      echo '  listen 443 ssl;' >> /etc/nginx/conf.d/default.conf;
      echo '  server_name _;' >> /etc/nginx/conf.d/default.conf;
      echo '  ssl_certificate     /etc/nginx/certs/server.crt;' >> /etc/nginx/conf.d/default.conf;
      echo '  ssl_certificate_key /etc/nginx/certs/server.key;' >> /etc/nginx/conf.d/default.conf;
      echo '  ssl_protocols       TLSv1.2 TLSv1.3;' >> /etc/nginx/conf.d/default.conf;
      echo '  ssl_prefer_server_ciphers on;' >> /etc/nginx/conf.d/default.conf;
      echo '  add_header X-Content-Type-Options nosniff;' >> /etc/nginx/conf.d/default.conf;
      echo '  add_header X-Frame-Options SAMEORIGIN;' >> /etc/nginx/conf.d/default.conf;
      echo '  add_header Referrer-Policy no-referrer-when-downgrade;' >> /etc/nginx/conf.d/default.conf;
      echo '  add_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;' >> /etc/nginx/conf.d/default.conf;
      echo '  location / {' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_http_version 1.1;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_set_header Host $$host;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_set_header X-Real-IP $$remote_addr;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_set_header X-Forwarded-Proto $$scheme;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_pass http://app:8000;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_connect_timeout 180s;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_send_timeout 180s;' >> /etc/nginx/conf.d/default.conf;
      echo '    proxy_read_timeout 180s;' >> /etc/nginx/conf.d/default.conf;
      echo '  }' >> /etc/nginx/conf.d/default.conf;
      echo '}' >> /etc/nginx/conf.d/default.conf;
      exec nginx -g 'daemon off;'"
    restart: unless-stopped
